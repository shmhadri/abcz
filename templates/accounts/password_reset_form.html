{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>استعادة كلمة المرور</title>
    <link rel="stylesheet" href="{% static 'css/site_public.css' %}">
</head>
<body>
<main class="site-shell">
    <section class="panel" style="max-width: 38rem; margin: 3rem auto;">
        <h1>نسيت كلمة المرور؟</h1>
        <p>أدخل بريدك الإلكتروني. إذا كان مرتبطًا بحساب صالح فسنرسل تعليمات الاستعادة.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.email.errors }}
            <label for="id_email">البريد الإلكتروني</label>
            <input id="id_email" name="email" type="email" autocomplete="email" required>
            <button type="submit">إرسال رابط الاستعادة</button>
        </form>
        <p><a href="{% url 'login' %}">العودة إلى تسجيل الدخول</a></p>
    </section>
</main>
</body>
</html>
