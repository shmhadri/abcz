<section class="rich-panel" data-rich-panel="mission"><p class="journey-kicker">English Adventure</p><h2>🎯 Mission: {{ content.mission.title }}</h2><p>{{ content.mission.real_world_task }}</p><div class="mission-steps">{% for step in content.mission.steps %}<label><input type="checkbox"><span>{{ forloop.counter }}</span>{{ step }}</label>{% endfor %}</div>{% for criterion in content.mission.success_criteria %}<blockquote>{{ criterion }}</blockquote>{% endfor %}<p class="mission-status"></p><button class="journey-button" type="button" data-check-mission>تحقق من المهمة</button> <button class="journey-button primary rich-next">انتقل إلى الاختبار</button></section>
